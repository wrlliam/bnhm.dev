# Portainer stack (Stacks → Add stack → Repository, pointing at this repo).
# The image is built from the Dockerfile in the repo root.
name: bnhm-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bnhm-dev:local
    container_name: bnhm-dev
    restart: unless-stopped
    ports:
      - "${BNHM_PORT:-5000}:5000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.50"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
