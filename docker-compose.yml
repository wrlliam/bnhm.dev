# Portainer stack (Stacks → Add stack → paste or point at this repo).
# Set BNHM_IMAGE in the stack's environment variables, e.g.
#   BNHM_IMAGE=<your-dockerhub-user>/bnhm-dev:latest
name: bnhm-dev

services:
  web:
    image: ${BNHM_IMAGE:?Set BNHM_IMAGE to your Docker Hub image, e.g. user/bnhm-dev:latest}
    container_name: bnhm-dev
    restart: unless-stopped
    ports:
      - "${BNHM_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp/caddy:size=16m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.50"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
